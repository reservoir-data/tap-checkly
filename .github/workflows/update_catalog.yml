name: Update Catalog for tap-checkly

on:
  workflow_dispatch:
  schedule:
  # On Fridays
  - cron: '0 12 * * 5'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  # renovate: datasource=pypi depName=llm
  LLM_VERSION: 0.37.2
  # renovate: datasource=pypi depName=llm-github-copilot
  LLM_GITHUB_COPILOT_VERSION: 0.3.1
  # renovate: datasource=pypi depName=uv
  UV_VERSION: 0.13.8

jobs:
  update_openapi_specification:
    name: Update Catalog
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/create-github-app-token@v3.4.0
      id: generate-token
      with:
        permission-contents: write
        permission-pull-requests: write
        client-id: ${{ vars.RESERVOIR_GITHUB_APP_ID }}
        private-key: ${{ secrets.RESERVOIR_GITHUB_APP_PKEY }}
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@v10.4.0
      with:
        version: ${{ env.UV_VERSION }}
    - run: uv run scripts/update_catalog.py
    - id: check_schema_changes
      continue-on-error: true
      run: git diff --quiet tap_checkly/schemas
    - name: Install LLM with GitHub Copilot
      if: steps.check_schema_changes.outcome == 'failure'
      run: uv tool install --with llm-github-copilot=="${LLM_GITHUB_COPILOT_VERSION}" --with llm=="${LLM_VERSION}" llm
    - name: Review catalog changes
      if: steps.check_schema_changes.outcome == 'failure'
      id: review-catalog-changes
      env:
        GH_COPILOT_TOKEN: ${{ secrets.GH_COPILOT_TOKEN }}
        WORKSPACE_PATH: ${{ github.workspace }}
      run: |
        SYSTEM_PROMPT=$(cat "$WORKSPACE_PATH"/.github/prompts/update_catalog_prompt.txt)
        GENERATED_CONTENT=$(git --no-pager diff -p --no-color HEAD tap_checkly/schemas | llm prompt -m github_copilot/gpt-4o-mini -s "$SYSTEM_PROMPT")

        PR_TITLE=$(echo "$GENERATED_CONTENT" | head -n 1)
        PR_BODY=$(echo "$GENERATED_CONTENT" | tail -n +3)

        {
            echo 'title<<EOF'
            echo "$PR_TITLE"
            echo 'EOF'
            echo 'body<<EOF'
            echo "$PR_BODY"
            echo 'EOF'
            echo 'commit_message<<EOF'
            echo "$PR_TITLE"
            echo 'EOF'
        } >> "$GITHUB_OUTPUT"

    - uses: peter-evans/create-pull-request@v8.1.3
      # zizmor: ignore[superfluous-actions]
      if: steps.check_schema_changes.outcome == 'failure'
      with:
        title: ${{ steps.review-catalog-changes.outputs.title }}
        commit-message: ${{ steps.review-catalog-changes.outputs.commit_message }}
        body: ${{ steps.review-catalog-changes.outputs.body }}
        token: ${{ steps.generate-token.outputs.token }}
        signoff: true
